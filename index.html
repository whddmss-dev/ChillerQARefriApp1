<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>냉매 QR 재고관리</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f6fa;color:#172033}
header{background:#123e65;color:white;padding:20px 16px}header h1{margin:0;font-size:22px}header p{margin:7px 0 0;color:#c9d9e8;font-size:13px}
main{max-width:1000px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0000000c;margin-bottom:14px}.stat small{color:#68758a}.stat strong{display:block;font-size:24px;margin-top:6px}
nav{display:flex;overflow:auto;gap:8px;margin:14px 0}nav button{white-space:nowrap;border:0;padding:10px 13px;border-radius:10px;background:#dce6f0;color:#123e65;font-weight:700}nav button.active{background:#123e65;color:white}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#1565a8;color:white;font-weight:650}button.secondary{background:#e7edf4;color:#183b59}button.danger{background:#b83232}input,select{width:100%;padding:11px;border:1px solid #ccd6e1;border-radius:9px;font-size:15px;background:white}label{display:block;font-size:13px;color:#46566a;margin:10px 0 5px}form .grid{gap:10px}.hide{display:none!important}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e8edf2}th{color:#52647a;font-size:12px}td{word-break:break-word}.scroll{overflow:auto}.pill{font-size:12px;padding:4px 8px;border-radius:20px;background:#e9f4ff;color:#17578b}.muted{color:#718096;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.notice{background:#fff7df;border:1px solid #f1d58b;border-radius:12px;padding:12px;color:#745314;font-size:13px}
#reader{width:100%;max-width:480px;margin:auto}#qrprint{display:flex;flex-wrap:wrap;gap:12px}.labelbox{border:1px dashed #aaa;padding:12px;width:180px;text-align:center;background:white}
@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}main{padding:12px}.card{padding:13px}header{padding:16px}}
@media print{header,nav,.noprint,.notice{display:none!important}body{background:white}main{padding:0}.labelbox{break-inside:avoid}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<header><h1>♻️ 냉매 QR 재고관리</h1><p>입고 · 사용 · 회수 · 월별 재고 및 소모량</p></header>
<main>
<div class="notice">Supabase 연결 후 공용 재고 및 실시간 업데이트를 사용할 수 있습니다. 연결 전 데이터 백업을 권장합니다.</div>
<div class="stats" id="stats"></div>
<nav class="noprint" id="nav"></nav>
<section id="view"></section>
</main>
<script>
const KEY='refrigerant_qr_inventory_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"cylinders":[],"logs":[]}');
let tab='dashboard', scanner=null, sb=null, cloudBusy=false, cloudConfig=JSON.parse(localStorage.getItem('chillerqa_supabase_config')||'{}'), thresholds=JSON.parse(localStorage.getItem('chillerqa_thresholds')||'{}'), emailList=JSON.parse(localStorage.getItem('chillerqa_emails')||'[]'), emailFunctionUrl=localStorage.getItem('chillerqa_email_function')||'';
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();if(sb&&!cloudBusy)pushCloud().catch(e=>setCloudStatus('저장 오류: '+e.message));}
function setCloudStatus(msg){let el=document.getElementById('cloudStatus');if(el)el.textContent=msg;}
async function connectCloud(){try{let url=(cloudConfig.url||'').trim().replace(/\/$/,'');let key=(cloudConfig.key||'').trim();if(!url||!key)throw new Error('Project URL과 publishable key를 입력하세요.');sb=window.supabase.createClient(url,key);let {data:row,error}=await sb.from('refrigerant_shared').select('payload').eq('id',1).maybeSingle();if(error)throw error;if(row&&row.payload){cloudBusy=true;data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudBusy=false;render();setCloudStatus('공용 DB 연결 및 데이터 불러오기 완료');}else{await pushCloud();setCloudStatus('공용 DB에 현재 데이터 최초 저장 완료');}subscribeCloud();localStorage.setItem('chillerqa_supabase_config',JSON.stringify(cloudConfig));}catch(e){cloudBusy=false;sb=null;setCloudStatus('연결 실패: '+e.message);alert('Supabase 연결 실패: '+e.message)}}
async function pushCloud(){if(!sb)return;setCloudStatus('DB 저장 중...');let {error}=await sb.from('refrigerant_shared').upsert({id:1,payload:data,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;setCloudStatus('공용 DB 저장 완료 '+new Date().toLocaleTimeString());}
async function pullCloud(){if(!sb){alert('먼저 Supabase 연결을 설정하세요.');return}let {data:row,error}=await sb.from('refrigerant_shared').select('payload').eq('id',1).maybeSingle();if(error){alert(error.message);return}if(row?.payload){cloudBusy=true;data=row.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudBusy=false;render();setCloudStatus('DB 데이터 불러오기 완료')}else alert('공용 DB에 저장된 데이터가 없습니다.')}
function subscribeCloud(){if(!sb)return;sb.channel('refrigerant_shared_changes').on('postgres_changes',{event:'*',schema:'public',table:'refrigerant_shared',filter:'id=eq.1'},payload=>{if(payload.new?.payload){cloudBusy=true;data=payload.new.payload;localStorage.setItem(KEY,JSON.stringify(data));cloudBusy=false;render();setCloudStatus('다른 사용자의 변경사항 실시간 반영 '+new Date().toLocaleTimeString())}}).subscribe();}
function saveCloudSettings(){cloudConfig={url:document.getElementById('sburl').value.trim().replace(/\/$/,'').replace(/\/rest\/v1$/,''),key:document.getElementById('sbkey').value.trim()};emailFunctionUrl=document.getElementById('emailfn').value.trim();localStorage.setItem('chillerqa_supabase_config',JSON.stringify(cloudConfig));localStorage.setItem('chillerqa_email_function',emailFunctionUrl);connectCloud();}
function saveThresholds(){thresholds={};document.querySelectorAll('[data-refrigerant]').forEach(el=>{let r=el.dataset.refrigerant,v=el.value.trim();if(v!=='')thresholds[r]=Number(v)});emailList=document.getElementById('emailList').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,10);localStorage.setItem('chillerqa_thresholds',JSON.stringify(thresholds));localStorage.setItem('chillerqa_emails',JSON.stringify(emailList));alert('재고 기준 및 이메일 수신자 저장 완료');render();checkLowStock(true);}
function viewSettings(){let refrigerants=[...new Set(data.cylinders.map(c=>c.refrigerant))].sort();return `<div class="card"><h3>Supabase 공용 DB 설정</h3><p class="muted">Project URL과 publishable key를 입력합니다. publishable key는 웹에 공개되는 키이며 secret/service_role 키는 입력하지 마세요.</p><label>Project URL</label><input id="sburl" placeholder="https://프로젝트ID.supabase.co" value="${esc(cloudConfig.url||'')}"><label>Publishable key</label><input id="sbkey" placeholder="sb_publishable_..." value="${esc(cloudConfig.key||'')}"><button style="margin-top:12px" onclick="saveCloudSettings()">연결 / 저장</button><div class="actions" style="margin-top:10px"><button class="secondary" onclick="pullCloud()">DB 불러오기</button><button class="secondary" onclick="pushCloud()">DB에 저장</button></div><p id="cloudStatus" class="muted">${sb?'연결됨':'연결 전'}</p></div><div class="card"><h3>냉매별 최소 재고 기준 (kg)</h3><p class="muted">현재 등록된 냉매별 총 잔량이 기준 이하일 경우 알림 조건에 해당합니다.</p>${refrigerants.map(r=>`<label>${esc(r)}</label><input data-refrigerant="${esc(r)}" type="number" min="0" step="0.1" placeholder="기준 kg" value="${thresholds[r]??''}">`).join('')||'<p>용기를 등록하면 냉매별 기준 설정 항목이 나타납니다.</p>'}<label>이메일 수신자 (최대 10개, 쉼표 또는 줄바꿈)</label><textarea id="emailList" rows="4" style="width:100%;padding:10px;border:1px solid #ccd6e1;border-radius:9px" placeholder="name@example.com">${esc(emailList.join('\n'))}</textarea><label>Supabase Edge Function URL (이메일 발송용)</label><input id="emailfn" placeholder="https://프로젝트ID.supabase.co/functions/v1/low-stock-email" value="${esc(emailFunctionUrl)}"><p class="muted">메일 발송 기능은 Edge Function 및 이메일 서비스 설정 후 활성화됩니다.</p><button style="margin-top:12px" onclick="saveThresholds()">기준 / 수신자 저장</button><button class="secondary" style="margin-top:12px" onclick="checkLowStock(false)">재고 부족 확인 / 테스트</button></div><div class="card notice"><b>주의:</b> 현재 공용 DB는 하나의 JSON payload를 공유하는 간단한 MVP입니다. 동시 편집 시 덮어쓰기 위험이 있으며, 실제 운영 전 로그인/권한과 DB 구조 분리 및 안전한 이메일 발송 로직을 권장합니다.</div>`}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;').replaceAll('\'','&#39;');}
function checkLowStock(test){let stock={};data.cylinders.forEach(c=>stock[c.refrigerant]=(stock[c.refrigerant]||0)+balance(c));let low=Object.entries(thresholds).filter(([r,t])=>(stock[r]||0)<=Number(t));if(!low.length){if(!test)alert('기준 이하인 냉매가 없습니다.');return}let message=low.map(([r,t])=>`${r}: 잔량 ${fmt(stock[r]||0)} (기준 ${fmt(t)})`).join('\n');if(!emailFunctionUrl||!emailList.length){alert('재고 부족:\n'+message+'\n\n메일 발송 URL 또는 수신자를 설정하세요.');return}fetch(emailFunctionUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lowStock:low.map(([r,t])=>({refrigerant:r,stock:stock[r]||0,threshold:Number(t)})),recipients:emailList,subject:'ChillerQA 냉매 재고 부족 알림',test})}).then(async res=>{if(!res.ok)throw new Error(await res.text());alert('메일 발송 요청 성공\n'+message)}).catch(e=>alert('메일 발송 요청 오류: '+e.message));}

function fmt(n){return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:3})+' kg'}
function balance(c){return c.initial+data.logs.filter(x=>x.cylinderId===c.id).reduce((s,x)=>s+(x.type==='in'?x.qty:x.type==='recovery'?x.qty:-x.qty),0)}
function totals(){let incoming=data.cylinders.reduce((s,c)=>s+c.initial,0)+data.logs.filter(x=>x.type==='in').reduce((s,x)=>s+x.qty,0);let used=data.logs.filter(x=>x.type==='use').reduce((s,x)=>s+x.qty,0);let recovered=data.logs.filter(x=>x.type==='recovery').reduce((s,x)=>s+x.qty,0);let stock=data.cylinders.reduce((s,c)=>s+balance(c),0);return {incoming,used,recovered,stock}}
function nav(){let arr=[['dashboard','대시보드'],['cylinders','용기/재고'],['entry','입고 등록'],['use','사용 등록'],['recovery','회수 등록'],['scan','QR 스캔'],['monthly','월별 통계'],['labels','QR 라벨'],['history','이력'],['settings','공유/알림 설정']];document.getElementById('nav').innerHTML=arr.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${t}</button>`).join('')}
function stats(){let t=totals();document.getElementById('stats').innerHTML=`<div class="card stat"><small>현재 보유량</small><strong>${fmt(t.stock)}</strong></div><div class="card stat"><small>누적 입고량</small><strong>${fmt(t.incoming)}</strong></div><div class="card stat"><small>누적 소모량</small><strong>${fmt(t.used)}</strong></div><div class="card stat"><small>누적 회수량</small><strong>${fmt(t.recovered)}</strong></div>`}
function cylinderSelect(){return data.cylinders.map(c=>`<option value="${c.id}">${c.code} · ${c.refrigerant} · 잔량 ${fmt(balance(c))}</option>`).join('')}
function viewDashboard(){let t=totals();return `<div class="card"><h3>재고 요약</h3><div class="scroll"><table><thead><tr><th>냉매</th><th>용기 수</th><th>총 잔량</th></tr></thead><tbody>${[...new Set(data.cylinders.map(c=>c.refrigerant))].map(r=>{let cs=data.cylinders.filter(c=>c.refrigerant===r);return `<tr><td>${r}</td><td>${cs.length}</td><td>${fmt(cs.reduce((s,c)=>s+balance(c),0))}</td></tr>`}).join('')||'<tr><td colspan="3">등록된 용기가 없습니다.</td></tr>'}</tbody></table></div></div><div class="card"><h3>최근 활동</h3>${recent(5)}</div>`}
function viewCylinders(){return `<div class="card"><h3>용기 목록</h3><div class="scroll"><table><thead><tr><th>QR ID</th><th>냉매</th><th>용기번호</th><th>입고</th><th>잔량</th><th>위치</th></tr></thead><tbody>${data.cylinders.map(c=>`<tr><td>${c.id}</td><td>${c.refrigerant}</td><td>${c.code}</td><td>${fmt(c.initial)}</td><td>${fmt(balance(c))}</td><td>${c.location||'-'}</td></tr>`).join('')||'<tr><td colspan="6">용기를 등록하세요.</td></tr>'}</tbody></table></div></div>`}
function cylinderForm(mode){return `<div class="card"><h3>${mode==='in'?'냉매 입고 등록':'냉매 사용/회수 등록'}</h3><form id="logform"><div class="grid"><div><label>용기 선택</label><select name="cylinder" required>${cylinderSelect()}</select></div><div><label>수량 (kg)</label><input name="qty" type="number" min="0.001" step="0.001" required placeholder="kg 입력"></div><div><label>날짜</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>작업자</label><input name="person" placeholder="작업자"></div><div><label>제품/시험기/작업</label><input name="work" placeholder="예: CH-001 시험"></div><div><label>메모</label><input name="note" placeholder="메모 (선택)"></div></div><button style="margin-top:14px">${mode==='in'?'입고 기록 저장':'기록 저장'}</button></form></div>`}
function viewEntry(){return `<div class="card"><h3>새 용기 입고 및 QR 등록</h3><form id="cform"><div class="grid"><div><label>냉매 종류</label><input name="refrigerant" required placeholder="예: R-1234ze"></div><div><label>용기 번호</label><input name="code" required placeholder="예: CY-2026-001"></div><div><label>입고량 (kg)</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div><label>입고 날짜</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>보관 위치</label><input name="location" placeholder="예: 냉매창고 A"></div><div><label>담당자</label><input name="person" placeholder="입고 담당"></div></div><button style="margin-top:14px">입고 등록 및 QR 생성</button></form></div><div class="card"><h3>입고 처리 안내</h3><p class="muted">등록 시 고유 QR ID를 생성합니다. QR은 QR 라벨 탭에서 출력할 수 있습니다.</p></div>`}
function viewUse(){return data.cylinders.length?cylinderForm('use'):`<div class="card">먼저 용기를 입고 등록해 주세요.</div>`}
function viewRecovery(){return data.cylinders.length?cylinderForm('recovery'):`<div class="card">먼저 용기를 입고 등록해 주세요.</div>`}
function viewScan(){return `<div class="card"><h3>QR코드 스캔</h3><div class="actions noprint"><button onclick="startScan()">카메라 실행</button><button class="secondary" onclick="stopScan()">카메라 중지</button></div><div id="reader"></div><div id="scanresult"></div><p class="muted">카메라 권한을 허용하세요. HTTPS 또는 localhost에서만 카메라가 동작할 수 있습니다.</p></div>`}
function viewMonthly(){let months=[...new Set(data.logs.map(x=>x.date.slice(0,7)).concat(data.cylinders.map(x=>x.date.slice(0,7))))].sort().reverse();let rows=months.map(m=>{let ins=data.cylinders.filter(c=>c.date.startsWith(m)).reduce((s,c)=>s+c.initial,0)+data.logs.filter(x=>x.date.startsWith(m)&&x.type==='in').reduce((s,x)=>s+x.qty,0);let use=data.logs.filter(x=>x.date.startsWith(m)&&x.type==='use').reduce((s,x)=>s+x.qty,0);let rec=data.logs.filter(x=>x.date.startsWith(m)&&x.type==='recovery').reduce((s,x)=>s+x.qty,0);return `<tr><td>${m}</td><td>${fmt(ins)}</td><td>${fmt(use)}</td><td>${fmt(rec)}</td></tr>`}).join('');return `<div class="card"><h3>월별 입고·소모·회수량</h3><div class="scroll"><table><thead><tr><th>월</th><th>입고량</th><th>소모량</th><th>회수량</th></tr></thead><tbody>${rows||'<tr><td colspan="4">기록이 없습니다.</td></tr>'}</tbody></table></div><p class="muted">월별 입고는 신규 용기 등록 및 추가 입고 기록을 합산합니다.</p></div>`}
function viewLabels(){return `<div class="card"><h3>QR 라벨 인쇄</h3><p class="muted">등록된 용기별 QR코드가 생성됩니다. 인쇄 후 용기에 부착하세요.</p><button class="noprint" onclick="window.print()">라벨 인쇄</button></div><div id="qrprint">${data.cylinders.map(c=>`<div class="labelbox"><strong>${c.refrigerant}</strong><div>${c.code}</div><div id="qr-${c.id}"></div><small>${c.id}</small></div>`).join('')}</div>`}
function recent(n){return `<div class="scroll"><table><thead><tr><th>날짜</th><th>종류</th><th>QR ID</th><th>수량</th><th>작업</th></tr></thead><tbody>${data.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n).map(x=>`<tr><td>${x.date}</td><td>${typeName(x.type)}</td><td>${x.cylinderId}</td><td>${fmt(x.qty)}</td><td>${x.work||'-'}</td></tr>`).join('')||'<tr><td colspan="5">기록이 없습니다.</td></tr>'}</tbody></table></div>`}
function typeName(t){return t==='in'?'추가 입고':t==='use'?'소모':'회수'}
function viewHistory(){return `<div class="card"><h3>전체 이력</h3><div class="actions noprint"><button onclick="exportCSV()">CSV/Excel용 내보내기</button><button class="secondary" onclick="backup()">JSON 백업</button><label style="margin:0"><input style="width:auto" type="file" accept=".json" onchange="restore(event)"> 백업 복원</label></div>${recent(1000)}</div>`}
function render(){nav();stats();let v=document.getElementById('view');let content={dashboard:viewDashboard,cylinders:viewCylinders,entry:viewEntry,use:viewUse,recovery:viewRecovery,scan:viewScan,monthly:viewMonthly,labels:viewLabels,history:viewHistory,settings:viewSettings};v.innerHTML=content[tab]();if(tab==='labels')data.cylinders.forEach(c=>{let el=document.getElementById('qr-'+c.id);if(el&&window.QRCode)new QRCode(el,{text:c.id,width:100,height:100})});bindForms()}
function bindForms(){let cf=document.getElementById('cform');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),id='RF-'+String(Date.now()).slice(-8);data.cylinders.push({id,refrigerant:f.get('refrigerant').trim(),code:f.get('code').trim(),initial:Number(f.get('qty')),date:f.get('date'),location:f.get('location'),person:f.get('person')});tab='labels';save();alert('입고 등록 완료! QR 라벨 탭에서 출력할 수 있습니다.')};let lf=document.getElementById('logform');if(lf)lf.onsubmit=e=>{e.preventDefault();let f=new FormData(lf),id=f.get('cylinder'),qty=Number(f.get('qty')),c=data.cylinders.find(c=>c.id===id),type=tab==='use'?'use':'recovery';if(type==='use'&&qty>balance(c)){alert('입력량이 현재 잔량보다 큽니다.');return}data.logs.push({type,cylinderId:id,qty,date:f.get('date'),person:f.get('person'),work:f.get('work'),note:f.get('note')});save();alert('기록이 저장되었습니다.')}}
async function startScan(){if(!window.Html5Qrcode){alert('QR 스캔 라이브러리 로딩 실패. 인터넷 연결 확인');return}scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:230},decoded=>{stopScan();let c=data.cylinders.find(c=>c.id===decoded);document.getElementById('scanresult').innerHTML=c?`<div class="card"><h3>스캔 결과</h3><p><b>${c.refrigerant}</b> / ${c.code}</p><p>현재 잔량: <b>${fmt(balance(c))}</b></p><button onclick="tab='use';render()">사용 등록</button> <button class="secondary" onclick="tab='recovery';render()">회수 등록</button></div>`:`<p>등록되지 않은 QR: ${decoded}</p>`})}catch(e){alert('카메라 실행 실패: '+e)}}
async function stopScan(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}}
function exportCSV(){let lines=[['유형','날짜','QR ID','냉매','용기번호','수량kg','작업자','작업','메모'].join(',')];data.logs.forEach(x=>{let c=data.cylinders.find(c=>c.id===x.cylinderId);lines.push([typeName(x.type),x.date,x.cylinderId,c?.refrigerant||'',c?.code||'',x.qty,x.person||'',x.work||'',x.note||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))});data.cylinders.forEach(c=>lines.push(['용기등록',c.date,c.id,c.refrigerant,c.code,c.initial,c.person||'','신규 입고',c.location||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')));let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='냉매관리_이력.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='냉매관리_백업.json';a.click()}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert('복원 완료')}catch(err){alert('파일 형식 오류')}};r.readAsText(file)}
render();if(cloudConfig.url&&cloudConfig.key)setTimeout(()=>connectCloud(),300);
</script></body></html>
